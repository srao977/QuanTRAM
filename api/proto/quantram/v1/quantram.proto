syntax = "proto3";

package quantram.v1;

option go_package = "quantram/gen/quantram/v1;quantramv1";

// Increment 1 ingestion plus P-03 ModelService. Later increments append to this file.

enum InstrumentType {
  INSTRUMENT_TYPE_UNSPECIFIED = 0;
  INSTRUMENT_TYPE_STOCK = 1;
  INSTRUMENT_TYPE_ETF = 2;
  INSTRUMENT_TYPE_INDEX = 3;
}

enum QualityStatus {
  QUALITY_STATUS_UNSPECIFIED = 0;
  QUALITY_STATUS_COMPLETE = 1;
  QUALITY_STATUS_DEGRADED = 2;
  QUALITY_STATUS_STALE = 3;
  QUALITY_STATUS_PARTIAL = 4;
  QUALITY_STATUS_RECONSTRUCTED = 5;
  QUALITY_STATUS_INVALID = 6;
}

enum FeedState {
  FEED_STATE_UNSPECIFIED = 0;
  FEED_STATE_HEALTHY = 1;
  FEED_STATE_DEGRADED = 2;
  FEED_STATE_FAILED = 3;
  FEED_STATE_RECOVERING = 4;
}

enum ComponentState {
  COMPONENT_STATE_UNSPECIFIED = 0;
  COMPONENT_STATE_HEALTHY = 1;
  COMPONENT_STATE_DEGRADED = 2;
  COMPONENT_STATE_UNAVAILABLE = 3;
}

message Bar {
  string symbol = 1;
  string instrument_id = 2;
  InstrumentType instrument_type = 3;
  bool tradable = 4;
  string interval = 5;
  int64 interval_start_unix_ms = 6;
  int64 interval_end_unix_ms = 7;
  double open = 8;
  double high = 9;
  double low = 10;
  double close = 11;
  uint64 volume = 12;
  uint32 event_count = 13;
  // Exact provider timestamp text; QuanTRAM assigns no timing semantics.
  string source_timestamp = 14;
  int64 receipt_unix_ms = 15;
  string source = 16;
  QualityStatus quality_status = 17;
  bool is_final = 18;
  bool is_backfilled = 19;
  bool source_transition = 20;
  int64 data_age_ms = 21;
  string market_snapshot_id = 22;
}

message GetFeedHealthRequest {}

message FeedHealth {
  string source_id = 1;
  FeedState state = 2;
  int64 last_message_unix_ms = 3;
  int64 last_pong_rtt_ms = 4;
  uint32 consecutive_heartbeat_failures = 5;
  string last_error = 6;
  repeated string subscribed_symbols = 7;
}

message GetActiveSourceRequest {}

message ActiveSource {
  string source_id = 1;
  FeedState state = 2;
}

message StreamBarsRequest {
  repeated string symbols = 1;
  // Zero means stream until the client cancels.
  uint32 max_bars = 2;
  // When true, only finalized bars are streamed. Partial updates remain
  // on the default observe path.
  bool finalized_only = 3;
}

message GetBarWindowRequest {
  string symbol = 1;
  uint32 limit = 2;
}

message BarWindow {
  string symbol = 1;
  repeated Bar bars = 2;
}

message TriggerGapFillRequest {
  string symbol = 1;
  int64 from_unix_ms = 2;
  int64 to_unix_ms = 3;
}

message GapFillResult {
  string symbol = 1;
  uint32 bars_fetched = 2;
  uint32 bars_injected = 3;
  uint32 bars_deduplicated = 4;
  string message = 5;
}

message GetHealthRequest {}

message ComponentHealth {
  string name = 1;
  ComponentState state = 2;
  string detail = 3;
}

message HealthReport {
  ComponentState state = 1;
  repeated ComponentHealth components = 2;
}

message GetReadinessRequest {}

message ReadinessReport {
  bool ready = 1;
  bool observe = 2;
  bool infer = 3;
  string message = 4;
}

service MarketFeedService {
  rpc GetFeedHealth(GetFeedHealthRequest) returns (FeedHealth);
  rpc GetActiveSource(GetActiveSourceRequest) returns (ActiveSource);
}

service IngestionService {
  rpc StreamBars(StreamBarsRequest) returns (stream Bar);
  rpc GetBarWindow(GetBarWindowRequest) returns (BarWindow);
  rpc TriggerGapFill(TriggerGapFillRequest) returns (GapFillResult);
}

service OperationsService {
  rpc GetHealth(GetHealthRequest) returns (HealthReport);
  rpc GetReadiness(GetReadinessRequest) returns (ReadinessReport);
}

// P-03 adaptive DecisionEvent. HOLD is a decision. Skip never carries a side.
// Evaluate / ModelInferenceService wait for the PriceEngine increment.

enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BUY = 1;
  SIDE_SELL = 2;
  SIDE_HOLD = 3;
}

enum PathDirection {
  PATH_DIRECTION_UNSPECIFIED = 0;
  PATH_DIRECTION_UPWARD = 1;
  PATH_DIRECTION_DOWNWARD = 2;
  PATH_DIRECTION_FLAT = 3;
}

enum EmitterPosition {
  EMITTER_POSITION_UNSPECIFIED = 0;
  EMITTER_POSITION_FLAT = 1;
  EMITTER_POSITION_LONG = 2;
  EMITTER_POSITION_SHORT = 3;
}

enum ModelStatus {
  MODEL_STATUS_UNSPECIFIED = 0;
  MODEL_STATUS_INITIALIZING = 1;
  MODEL_STATUS_ACTIONABLE = 2;
}

enum SkipReason {
  SKIP_REASON_UNSPECIFIED = 0;
  SKIP_REASON_INFER_OFF = 1;
  SKIP_REASON_NOT_MODEL_ELIGIBLE = 2;
  SKIP_REASON_INITIALIZING = 3;
  SKIP_REASON_DUPLICATE_OR_REGRESSION = 4;
  SKIP_REASON_INPUT_GAP = 5;
  SKIP_REASON_QUEUE_OVERFLOW = 6;
  SKIP_REASON_TIMEOUT = 7;
  SKIP_REASON_INVALID_INPUT = 8;
  SKIP_REASON_ENGINE_ERROR = 9;
  SKIP_REASON_ENGINE_PANIC = 10;
  SKIP_REASON_STATE_DISCONTINUOUS = 11;
}

message Decision {
  Side side = 1;
  double confidence = 2;
  int32 h = 3;
  double q_g = 4;
  double q_s = 5;
  double q_r = 6;
  PathDirection path_direction = 7;
  ModelStatus model_status = 8;
  EmitterPosition emitter_position_state = 9;
  string rule_path = 10;
  double strength = 11;
  double coherence = 12;
  double persistence = 13;
  double uncertainty = 14;
  double reversal = 15;
  double terminal_displacement = 16;
}

message Skip {
  SkipReason reason = 1;
  string detail = 2;
  ModelStatus model_status = 3;
}

message DecisionEvent {
  string event_id = 1;
  string signal_id = 2;
  string decision_id = 3;
  string symbol = 4;
  int64 interval_start_unix_ms = 5;
  string market_snapshot_id = 6;
  string source_timestamp = 7;
  uint64 accepted_sequence = 8;
  int64 received_at_unix_ms = 9;
  int64 completed_at_unix_ms = 10;
  int64 latency_ms = 11;
  string model_version = 12;
  string schema_version = 13;
  string pre_state_hash = 14;
  string post_state_hash = 15;
  oneof outcome {
    Decision decision = 16;
    Skip skip = 17;
  }
}

message StreamDecisionsRequest {
  repeated string symbols = 1;
  // Zero means stream until the client cancels.
  uint32 max_events = 2;
}

service ModelService {
  rpc StreamDecisions(StreamDecisionsRequest) returns (stream DecisionEvent);
}
